name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: |
          pip install fonttools brotli
          python3 prototype/build.py --public --site _site
          # /mediajob/: the media-designer application variant (prototype/variants/mediajob.py), unlisted
          python3 prototype/build.py --public --mediajob --site _site/mediajob
          sed -i 's#<head>#<head>\n<meta name="robots" content="noindex">#' _site/mediajob/index.html
      # Next to the live site:
      #   /archive/              the previous site (main as of 15 Nov 2026, commit f1ebd02), kept online for reference
      #   /preview/next/         work in progress on branch claude/project-thread-fasidj
      #   /preview/long-scroll/  the long-scroll iteration of the redesign
      #   /preview/fluid/        the earlier particle-fluid iteration
      # They are rebuilt on every deploy; to refresh /preview/next/ after pushing that branch,
      # run this workflow by hand (Actions > Deploy prototype to GitHub Pages > Run workflow).
      - name: Build archive and design previews
        run: |
          git fetch origin claude/project-thread-fasidj || true
          extra () {   # extra <site path> <name> <commit>
            git worktree add "$RUNNER_TEMP/$2" "$3"
            python3 "$RUNNER_TEMP/$2/prototype/build.py" --public --site "_site/$1"
            # keep these copies out of search results
            sed -i 's#<head>#<head>\n<meta name="robots" content="noindex">#' "_site/$1/index.html"
          }
          extra archive archive f1ebd02
          if git rev-parse -q --verify FETCH_HEAD >/dev/null; then extra preview/next next FETCH_HEAD; fi
          extra preview/long-scroll long-scroll ace7932
          extra preview/fluid fluid a5afe17
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
